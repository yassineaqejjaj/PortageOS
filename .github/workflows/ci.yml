name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: portage, POSTGRES_PASSWORD: portage, POSTGRES_DB: portage }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portage" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://portage:portage@localhost:5432/portage
      APP_DATABASE_URL: postgresql://portage_app:ci_only_password@localhost:5432/portage
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      DEMO_PASSWORD: ci-only-demo-password
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Base de données (migrations, rôle applicatif)
        run: |
          pnpm -F @portage/api exec prisma migrate deploy
          pnpm -F @portage/api exec prisma generate
          psql "$DATABASE_URL" -c "ALTER ROLE portage_app LOGIN PASSWORD 'ci_only_password'"
      - run: pnpm typecheck
      - name: Build
        run: pnpm -F @portage/domain build && pnpm build
      - name: Tests unitaires et d'intégration
        run: pnpm test
      - name: Seed démo (test uniquement)
        run: pnpm seed
      - name: E2E Playwright
        run: |
          pnpm -F @portage/web exec playwright install --with-deps chromium
          pnpm -F @portage/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
